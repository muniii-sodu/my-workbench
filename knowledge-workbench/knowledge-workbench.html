<!DOCTYPE html>
<!-- Generated by Trae Work -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI知识思考</title>
<style>
@font-face {
  font-family: 'WorkSans';
  src: url('./_shared/fonts/WorkSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'WorkSans';
  src: url('./_shared/fonts/WorkSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #F5FAFB;
  --surface: #FFFFFF;
  --primary: #5BB5B3;
  --primary-dark: #4A9D9B;
  --primary-light: #A8DADC;
  --primary-bg: #E8F7F6;
  --primary-bg2: #F0FAF9;
  --ink: #2D3748;
  --muted: #718096;
  --muted2: #A0AEC0;
  --border: #E2E8F0;
  --border-light: #EDF2F7;
  --success: #68D391;
  --warning: #F6AD55;
  --danger: #FC8181;
  --cat-knowledge: #5BB5B3;
  --cat-knowledge-bg: #E8F7F6;
  --cat-experience: #7C9CBF;
  --cat-experience-bg: #EAF1F8;
  --cat-think: #B8A1D4;
  --cat-think-bg: #F3EFFA;
  --cat-tool: #F0A868;
  --cat-tool-bg: #FDF3E8;
  --shadow-sm: 0 2px 8px rgba(91,181,179,0.06);
  --shadow-md: 0 4px 16px rgba(91,181,179,0.08);
  --shadow-lg: 0 8px 28px rgba(91,181,179,0.10);
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --sidebar-w: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'WorkSans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

/* === Layout === */
.app { display: flex; height: 100vh; }

/* === Mobile Top Bar === */
.mobile-topbar {
  display: none;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  box-shadow: var(--shadow-sm);
}
.mobile-topbar .menu-btn {
  width: 44px; height: 44px;
  border: none; background: var(--primary-bg);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: var(--radius-xs);
  color: var(--ink);
  flex-shrink: 0;
}
.mobile-topbar .menu-btn:active { background: var(--primary-light); }
.mobile-topbar .menu-btn svg { width: 24px; height: 24px; display: block; }
.mobile-topbar .logo-text { font-size: 16px; font-weight: 700; color: var(--primary); }
.mobile-topbar .sync-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 0 3px rgba(104,211,145,0.2);
}

/* === Sidebar === */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  height: 100vh;
  transition: transform 0.3s ease;
  z-index: 150;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border-light);
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.sidebar-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sidebar-logo-icon svg { width: 20px; height: 20px; }
.sidebar-logo-text { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.sidebar-logo-sub { font-size: 11px; color: var(--muted); font-weight: 400; }

.sync-status {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--primary-bg2);
  border-radius: var(--radius-xs);
  font-size: 12px;
  color: var(--muted);
}
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px rgba(104,211,145,0.15);
  flex-shrink: 0;
}
.sync-dot.offline { background: var(--muted2); box-shadow: 0 0 0 3px rgba(160,174,192,0.15); }

.sidebar-nav {
  flex: 1;
  padding: 12px 12px 24px;
}

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 2px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
}
.nav-item:hover { background: var(--primary-bg2); }
.nav-item.active { background: var(--primary-bg); color: var(--primary-dark); font-weight: 600; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg { opacity: 1; color: var(--primary); }
.nav-item .nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--primary-bg);
  color: var(--primary);
  font-weight: 600;
}

.nav-category {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 16px 14px 6px;
  display: flex; align-items: center; gap: 8px;
}
.nav-category svg { width: 16px; height: 16px; }

.nav-module {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px 9px 36px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 1px;
  color: var(--muted);
  font-size: 13px;
}
.nav-module:hover { background: var(--primary-bg2); color: var(--ink); }
.nav-module.active { background: var(--primary-bg); color: var(--primary-dark); font-weight: 600; }
.nav-module-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  opacity: 0.5;
}
.nav-module.active .nav-module-dot { opacity: 1; }
.nav-module-check {
  margin-left: auto;
  width: 16px; height: 16px;
  opacity: 0;
  flex-shrink: 0;
}
.nav-module.checked .nav-module-check { opacity: 1; }

/* === Main Content === */
.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  height: 100vh;
  position: relative;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

/* === Topbar === */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
  position: sticky;
  top: 0;
  z-index: 50;
  min-height: 64px;
}
.topbar-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.topbar-actions { margin-left: auto; display: flex; gap: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
}
.btn svg { width: 16px; height: 16px; }
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-soft {
  background: var(--primary-bg);
  color: var(--primary-dark);
}
.btn-soft:hover { background: var(--primary-light); color: #fff; }
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--primary-bg2); color: var(--primary); }

/* === Dashboard === */
.dashboard { padding: 24px 28px 40px; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-icon svg { width: 24px; height: 24px; }
.stat-info { flex: 1; }
.stat-num { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--muted); }

.section-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title svg { width: 20px; height: 20px; color: var(--primary); }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 20px;
}
.card-body { padding: 20px; }

.chart-container { width: 100%; }

/* === Timeline === */
.timeline-item {
  display: flex;
  gap: 14px;
  padding: 12px 0;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: var(--radius-xs);
  padding-left: 8px;
  padding-right: 8px;
}
.timeline-item:hover { background: var(--primary-bg2); }
.timeline-dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.timeline-content { flex: 1; min-width: 0; }
.timeline-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.timeline-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 600;
}
.timeline-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* === Module Grid === */
.module-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.module-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.module-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.module-card.cat-knowledge::before { background: var(--cat-knowledge); }
.module-card.cat-experience::before { background: var(--cat-experience); }
.module-card.cat-think::before { background: var(--cat-think); }
.module-card.cat-tool::before { background: var(--cat-tool); }

.module-card-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.module-card-num {
  width: 32px; height: 32px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.module-card-title { font-size: 14px; font-weight: 700; line-height: 1.4; flex: 1; }
.module-card-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.module-card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.module-card-tag {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.module-card-platform {
  font-size: 11px;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 4px;
}
.module-card-check {
  position: absolute;
  top: 16px; right: 16px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--success);
  display: none;
  align-items: center;
  justify-content: center;
}
.module-card.checked .module-card-check { display: flex; }
.module-card-check svg { width: 14px; height: 14px; color: #fff; }

/* === Module View === */
.module-view-container {
  display: none;
  flex-direction: column;
  height: calc(100vh - 64px);
}
.module-view-container.active { display: flex; }
.module-iframe {
  flex: 1;
  width: 100%;
  border: none;
  background: var(--surface);
}
.module-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  background: var(--surface);
  border-top: 1px solid var(--border-light);
  flex-wrap: wrap;
}
.module-toolbar .ext-link {
  font-size: 12px;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  padding: 6px 14px;
  background: var(--primary-bg);
  border-radius: 20px;
  font-weight: 600;
}
.module-toolbar .ext-link:hover { background: var(--primary); color: #fff; }

.module-notes {
  padding: 16px 28px;
  background: var(--surface);
  border-top: 1px solid var(--border-light);
}
.module-notes-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.module-notes-label .save-indicator {
  margin-left: auto;
  font-size: 11px;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 4px;
}
.module-notes textarea {
  width: 100%;
  min-height: 80px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  color: var(--ink);
  background: var(--primary-bg2);
  transition: border-color 0.2s;
}
.module-notes textarea:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--surface);
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
}
.empty-state-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--primary-bg);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.empty-state-icon svg { width: 32px; height: 32px; color: var(--primary); }
.empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.empty-state p { font-size: 13px; color: var(--muted); max-width: 400px; line-height: 1.7; }

/* === Check-in View === */
.checkin-view { padding: 24px 28px 40px; display: none; }
.checkin-view.active { display: block; }

.checkin-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.checkin-stat {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.checkin-stat-icon {
  width: 52px; height: 52px;
  border-radius: 16px;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
}
.checkin-stat-icon svg { width: 26px; height: 26px; }
.checkin-stat-num { font-size: 32px; font-weight: 700; line-height: 1.2; }
.checkin-stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

.checkin-list {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 24px;
}
.checkin-list-header {
  padding: 16px 20px;
  font-size: 14px;
  font-weight: 700;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  gap: 8px;
}
.checkin-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
  transition: background 0.2s;
}
.checkin-item:last-child { border-bottom: none; }
.checkin-item:hover { background: var(--primary-bg2); }
.checkin-item-info { flex: 1; min-width: 0; }
.checkin-item-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.checkin-item-meta { font-size: 12px; color: var(--muted); }
.checkin-btn {
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1.5px solid var(--primary);
  background: transparent;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.checkin-btn:hover { background: var(--primary-bg); }
.checkin-btn.done {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  cursor: default;
}
.checkin-btn.done:hover { opacity: 0.9; }

/* === History (Date Folded) === */
.history-section { margin-bottom: 24px; }
.history-group {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 12px;
}
.history-group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}
.history-group-header:hover { background: var(--primary-bg2); }
.history-group-arrow {
  width: 20px; height: 20px;
  transition: transform 0.3s;
  color: var(--muted);
}
.history-group.collapsed .history-group-arrow { transform: rotate(-90deg); }
.history-group-date {
  font-size: 14px;
  font-weight: 700;
  flex: 1;
}
.history-group-count {
  font-size: 12px;
  color: var(--muted);
  padding: 2px 10px;
  background: var(--primary-bg2);
  border-radius: 20px;
}
.history-group-body {
  padding: 0 20px;
  max-height: 2000px;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s;
}
.history-group.collapsed .history-group-body {
  max-height: 0;
  padding-top: 0;
  padding-bottom: 0;
}
.history-record {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--border-light);
}
.history-record-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.history-record-info { flex: 1; }
.history-record-title { font-size: 13px; font-weight: 600; }
.history-record-time { font-size: 11px; color: var(--muted2); }
.history-record-note {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  font-style: italic;
}

/* === Overlay === */
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
}

/* === Responsive === */
@media (max-width: 1024px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .module-grid { grid-template-columns: repeat(2, 1fr); }
  .checkin-summary { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 900px) {
  .mobile-topbar { display: flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
    padding-top: 56px;
    -webkit-overflow-scrolling: touch;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header { padding-top: 16px; }
  .main { padding-top: 56px; }
  .topbar { padding: 12px 16px; }
  .dashboard { padding: 16px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-card { padding: 14px; }
  .stat-num { font-size: 22px; }
  .stat-icon { width: 40px; height: 40px; }
  .module-grid { grid-template-columns: 1fr; }
  .checkin-summary { grid-template-columns: 1fr; }
  .checkin-view { padding: 16px; }
  .module-view-container { height: calc(100vh - 112px); }
  .module-toolbar { padding: 10px 16px; }
  .module-notes { padding: 12px 16px; }
  .topbar-title { font-size: 15px; }
  .overlay.show { display: block; opacity: 1; }
}

@media (max-width: 480px) {
  .stats-row { grid-template-columns: 1fr 1fr; }

// ===== LocalStorage Helper =====
function getStore(key, def) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch(e) { return def; }
}
function setStore(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

// ===== Check-in System =====
function getCheckins() { return getStore('ai_checkins', {}); }
function getTodayStr() { return new Date().toISOString().slice(0,10); }
function isModuleCheckedToday(key) {
  var checkins = getCheckins();
  var today = getTodayStr();
  return checkins[today] && checkins[today].some(function(c) { return c.module === key; });
}
function toggleCheckin(key) {
  var checkins = getCheckins();
  var today = getTodayStr();
  if (!checkins[today]) checkins[today] = [];
  var idx = checkins[today].findIndex(function(c) { return c.module === key; });
  if (idx >= 0) {
    checkins[today].splice(idx, 1);
  } else {
    checkins[today].push({ module: key, time: new Date().toISOString(), note: '' });
  }
  setStore('ai_checkins', checkins);
  updateCheckinUI();
  updateSidebarCheckin();
}
function getTotalCheckins() {
  var checkins = getCheckins();
  var count = 0;
  Object.keys(checkins).forEach(function(d) { count += checkins[d].length; });
  return count;
}
function getStreak() {
  var checkins = getCheckins();
  var streak = 0;
  var date = new Date();
  while (true) {
    var ds = date.toISOString().slice(0,10);
    if (checkins[ds] && checkins[ds].length > 0) {
      streak++;
      date.setDate(date.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// ===== Notes System =====
function getNotes() { return getStore('ai_notes', {}); }
function getNote(key) { var n = getNotes(); return n[key] || ''; }
function saveNote(key, text) {
  var n = getNotes();
  n[key] = text;
  setStore('ai_notes', n);
}
function autoSaveNote() {
  if (!currentModule) return;
  var text = document.getElementById('module-notes-area').value;
  saveNote(currentModule, text);
  var indicator = document.getElementById('save-indicator');
  indicator.style.opacity = '1';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    indicator.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><polyline points="20 6 9 17 4 12"/></svg> 已保存';
    indicator.style.color = 'var(--success)';
  }, 300);
  indicator.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/></svg> 保存中...';
  indicator.style.color = 'var(--muted)';
}

function showView(view) {
  currentView = view;
  closeSidebar();
  document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';
  document.getElementById('module-view-container').classList.toggle('active', view === 'module');
  document.getElementById('empty-module-view').classList.toggle('hidden', view !== 'empty');
  document.getElementById('checkin-view').classList.toggle('active', view === 'checkin');
  document.getElementById('history-view').classList.toggle('active', view === 'history');

  if (view === 'dashboard') {
    document.getElementById('topbar-title').textContent = '知识全景仪表盘';
    document.getElementById('topbar-actions').innerHTML = '';
    setTimeout(function() {
      if (window.knowledgeMapChart) window.knowledgeMapChart.resize();
      if (window.topicsChart) window.topicsChart.resize();
    }, 100);
  } else if (view === 'checkin') {
    document.getElementById('topbar-title').textContent = '今日打卡';
    document.getElementById('topbar-actions').innerHTML = '';
    updateCheckinUI();
    renderHistory('history-container', true);
  } else if (view === 'history') {
    document.getElementById('topbar-title').textContent = '学习记录';
    document.getElementById('topbar-actions').innerHTML = '';
    renderHistory('history-full-container', false);
  }

  // Update nav active
  document.querySelectorAll('[data-nav]').forEach(function(n) {
    n.classList.remove('active');
  });
  var navTarget = view === 'module' ? (currentModule || 'dashboard') : view;
  var navEl = document.querySelector('[data-nav="' + navTarget + '"]');
  if (navEl) navEl.classList.add('active');
}

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' +
          mod.platform +
        '</span>' +
        (mod.extUrl ? '<span class="module-card-platform" style="color:var(--primary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>可跳转</span>' : '') +
      '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

// ===== Check-in UI =====
function updateCheckinUI() {
  var keys = ['rag', 'agent', 'eval', 'pm-eval', 'prompt', 'alibaba', 'eleme', 'value', 'skill', 'github'];
  var todayCount = 0;
  var html = '';
  keys.forEach(function(key) {
    var mod = MODULES[key];
    var checked = isModuleCheckedToday(key);
    if (checked) todayCount++;
    var catBgs = {
      'cat-knowledge': 'var(--cat-knowledge-bg)',
      'cat-experience': 'var(--cat-experience-bg)',
      'cat-think': 'var(--cat-think-bg)',
      'cat-tool': 'var(--cat-tool-bg)'
    };
    var catColors = {
      'cat-knowledge': 'var(--cat-knowledge)',
      'cat-experience': 'var(--cat-experience)',
      'cat-think': 'var(--cat-think)',
      'cat-tool': 'var(--cat-tool)'
    };
    html += '<div class="checkin-item">' +
      '<div class="nav-module-dot" style="background:' + catColors[mod.catClass] + ';width:10px;height:10px"></div>' +
      '<div class="checkin-item-info">' +
        '<div class="checkin-item-title">' + mod.title + '</div>' +
        '<div class="checkin-item-meta"><span style="background:' + catBgs[mod.catClass] + ';color:' + catColors[mod.catClass] + ';padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600">' + mod.category + '</span> · ' + mod.platform + '</div>' +
      '</div>' +
      '<button class="checkin-btn ' + (checked ? 'done' : '') + '" onclick="toggleCheckin(\'' + key + '\')">' +
        (checked ? '✓ 已打卡' : '打卡') +
      '</button>' +
    '</div>';
  });
  document.getElementById('checkin-list').innerHTML = html;
  document.getElementById('today-count').textContent = todayCount;
  document.getElementById('streak-count').textContent = getStreak();
  document.getElementById('total-count').textContent = getTotalCheckins();
  document.getElementById('total-checkin-count').textContent = getTotalCheckins();
  document.getElementById('today-checkin-badge').textContent = todayCount + '/' + keys.length;
}

// ===== History (Date Folded) =====
function renderHistory(containerId, limitRecent) {
  var checkins = getCheckins();
  var dates = Object.keys(checkins).sort().reverse();
  if (limitRecent && dates.length > 10) dates = dates.slice(0, 10);

  var todayStr = getTodayStr();
  var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  var yesterdayStr = yesterday.toISOString().slice(0,10);

  var html = '';
  if (dates.length === 0) {
    html = '<div style="text-align:center;padding:40px 20px;color:var(--muted)">' +
      '<div style="font-size:2.5rem;margin-bottom:8px;opacity:0.3">📅</div>' +
      '<p style="font-size:14px">还没有学习记录，去打卡吧！</p></div>';
  } else {
    dates.forEach(function(date) {
      var records = checkins[date];
      var label = date;
      if (date === todayStr) label = '今天';
      else if (date === yesterdayStr) label = '昨天';
      else {
        var d = new Date(date);
        var now = new Date();
        var diff = Math.floor((now - d) / (1000*60*60*24));
        if (diff < 7) label = diff + '天前';
        else label = (d.getMonth()+1) + '月' + d.getDate() + '日';
      }

      var isFirst = (date === dates[0]);
      html += '<div class="history-group' + (isFirst ? '' : ' collapsed') + '">';
      html += '<div class="history-group-header" onclick="this.parentElement.classList.toggle(\'collapsed\')">';
      html += '<svg class="history-group-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      html += '<span class="history-group-date">' + label + ' · ' + date + '</span>';
      html += '<span class="history-group-count">' + records.length + '个模块</span>';
      html += '</div>';
      html += '<div class="history-group-body">';
      records.forEach(function(r) {
        var mod = MODULES[r.module];
        if (!mod) return;
        var catColors = {
          'cat-knowledge': 'var(--cat-knowledge)',
          'cat-experience': 'var(--cat-experience)',
          'cat-think': 'var(--cat-think)',
          'cat-tool': 'var(--cat-tool)'
        };
        var time = new Date(r.time);
        var timeStr = time.getHours().toString().padStart(2,'0') + ':' + time.getMinutes().toString().padStart(2,'0');
        html += '<div class="history-record">' +
          '<div class="history-record-dot" style="background:' + catColors[mod.catClass] + '"></div>' +
          '<div class="history-record-info">' +
            '<div class="history-record-title">' + mod.title + '</div>' +
            '<div class="history-record-time">' + timeStr + ' · ' + mod.platform + '</div>' +
          '</div>' +
          '<button class="btn btn-ghost" style="padding:4px 12px;font-size:11px" onclick="showModule(\'' + r.module + '\')">查看</button>' +
        '</div>';
      });
      html += '</div></div>';
    });
  }
  document.getElementById(containerId).innerHTML = html;
}

// ===== Sidebar Checkin Indicators =====
function updateSidebarCheckin() {
  var keys = ['rag', 'agent', 'eval', 'pm-eval', 'prompt', 'alibaba', 'eleme', 'value', 'skill', 'github'];
  keys.forEach(function(key) {
    var navEl = document.querySelector('[data-nav="' + key + '"]');
    if (navEl) {
      if (isModuleCheckedToday(key)) navEl.classList.add('checked');
      else navEl.classList.remove('checked');
    }
  });
}

// ===== Sidebar Toggle (Mobile) =====
function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ===== Init =====
renderTimeline();
renderModuleGrid();
updateSidebarCheckin();
updateCheckinUI();

// Show dashboard by default
showView('dashboard');

// Ensure charts resize after full render
setTimeout(function() {
  if (window.knowledgeMapChart) window.knowledgeMapChart.resize();
  if (window.topicsChart) window.topicsChart.resize();
}, 500);
</script>
